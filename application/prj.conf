# Logger module
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_TIMESTAMP_64BIT=y
CONFIG_LOG_BUFFER_SIZE=4096
# override the logging level for specific modules:
CONFIG_MPU_LOG_LEVEL_WRN=y
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_WRN=y
CONFIG_BT_CTLR_ISOAL_LOG_LEVEL_WRN=y

# # Better asserts
# CONFIG_ASSERT=y
# CONFIG_ASSERT_VERBOSE=y

# # Stack debugging
# CONFIG_INIT_STACKS=y
# CONFIG_THREAD_STACK_INFO=y
# CONFIG_THREAD_NAME=y

# Bluetooth LE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Silas ROM"

# Peripherals for IMU
CONFIG_I2C=y

# Increase stack size for the main thread and System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048